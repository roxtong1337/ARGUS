[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rea"
version = "0.1.0"
description = "REA - Reverse Engineering Anything: offline reverse-engineering toolkit with sandboxed detonation, the ARGUS agent, and a pluggable Hermes integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "REA Hackathon Team" }]
keywords = ["reverse-engineering", "malware-analysis", "dfir", "cyber-security", "static-analysis", "sandbox", "detonation"]
dependencies = []

[project.scripts]
rea = "rea.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["rea*"]

[tool.setuptools.package-data]
rea = ["../rules/*.rea"]
